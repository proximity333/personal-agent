name: build-desktop

# 手动触发：构建 NATIVE linux/arm64 桌面沙箱镜像并推送到 ghcr.io
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    # 原生 arm64 runner（public 仓库可用）
    runs-on: ubuntu-24.04-arm
    env:
      IMAGE: ghcr.io/proximity333/agent-desktop:mvp1
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: sandbox/Dockerfile.desktop.arm64
          platforms: linux/arm64
          # 单 manifest，避免 OCI index 在节点上匹配失败
          provenance: false
          sbom: false
          push: true
          tags: ${{ env.IMAGE }}