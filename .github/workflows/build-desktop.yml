name: build-desktop

# 手动触发：在 arm64 runner 上原生构建桌面沙箱镜像并推送到 ghcr.io
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    # 官方 sandbox-base 镜像是 amd64，且你的集群已验证可运行（QEMU 模拟）。
    # 用 x64 runner 原生构建 amd64，最稳。
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/proximity333/agent-desktop:latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: sandbox/Dockerfile.desktop
          platforms: linux/amd64
          # 关键：不要生成 OCI index / attestation。arm64 节点只能拉单 manifest 的 amd64
          # （官方 sandbox-base 也是单 manifest，靠 binfmt 运行）。
          provenance: false
          sbom: false
          push: true
          tags: ${{ env.IMAGE }}